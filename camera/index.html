<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT: OPTICS | Deconstruction</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="scroll-track"></div>

    <div class="hud-layer">
        <div class="hud-top-left">
            <div class="brand">SYS.OPTICS</div>
            <div class="status">STATUS: <span id="status-text">STANDBY</span></div>
        </div>
        <div class="hud-bottom-right">
            <div class="coordinates">X: <span id="val-x">00</span> Y: <span id="val-y">00</span></div>
            <div class="scroll-progress-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div class="sticky-viewport">
        
        <div class="perspective-grid"></div>

        <div class="intro-overlay">
            <h1 class="glitch-text" data-text="DECONSTRUCT">DECONSTRUCT</h1>
            <p>Scroll to Initialize Sequence</p>
            <i class="fas fa-chevron-down bounce"></i>
        </div>

        <div class="tech-panel" id="panel-sensor">
            <h3>CMOS SENSOR</h3>
            <p>Type: Full Frame 45MP</p>
            <p>Dynamic Range: 15 Stops</p>
            <div class="line-deco"></div>
        </div>

        <div class="tech-panel right" id="panel-lens">
            <h3>ASPHERICAL LENS</h3>
            <p>Coating: Nano Crystal</p>
            <p>Elements: 12 Groups</p>
            <div class="line-deco"></div>
        </div>

        <svg id="schematic-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
            <defs>
                <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(255,255,255,0.2)" />
                    <stop offset="100%" style="stop-color:rgba(0,210,255,0.1)" />
                </linearGradient>
            </defs>

            <g id="grp-body" transform="translate(300, 400)">
                <path d="M -150 -100 L 150 -100 L 150 100 L -150 100 L -150 -100" fill="#0b0b10" stroke="#444" stroke-width="2" />
                <path d="M -150 -80 L -180 -60 L -180 80 L -150 100" fill="#111" stroke="#555" />
                <path d="M -50 -100 L 0 -140 L 50 -100" fill="#0b0b10" stroke="#444" />
                
                <rect x="-60" y="-50" width="120" height="80" fill="none" stroke="#333" stroke-dasharray="5,5" />
                
                <g id="part-sensor">
                    <rect x="-40" y="-30" width="80" height="60" fill="#111" stroke="#ff4757" stroke-width="2" filter="url(#neon-glow)" />
                    <circle cx="0" cy="0" r="10" fill="#ff4757" opacity="0.5" />
                    <line x1="-40" y1="-30" x2="40" y2="30" stroke="#ff4757" opacity="0.2" />
                    <line x1="40" y1="-30" x2="-40" y2="30" stroke="#ff4757" opacity="0.2" />
                </g>
            </g>

            <g id="grp-mount" transform="translate(460, 400)">
                <circle cx="0" cy="0" r="70" fill="none" stroke="#888" stroke-width="4" />
                <circle cx="0" cy="0" r="60" fill="none" stroke="#fff" stroke-dasharray="10, 10" opacity="0.5" />
            </g>

            <g id="grp-lens" transform="translate(600, 400)">
                <g id="lens-rear">
                    <path d="M -20 -60 L 20 -60 L 20 60 L -20 60 Z" fill="none" stroke="#00d2ff" stroke-width="2" />
                    <ellipse cx="0" cy="0" rx="10" ry="50" fill="url(#glass-grad)" />
                </g>

                <g id="lens-aperture" transform="translate(50, 0)">
                    <circle cx="0" cy="0" r="55" fill="none" stroke="#00d2ff" stroke-width="2" filter="url(#neon-glow)" />
                    <g id="blades">
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(0)"/>
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(60)"/>
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(120)"/>
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(180)"/>
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(240)"/>
                        <path d="M 0 0 L -20 -50 L 20 -50 Z" fill="#00d2ff" opacity="0.3" transform="rotate(300)"/>
                    </g>
                </g>

                <g id="lens-mid" transform="translate(100, 0)">
                    <path d="M -15 -65 L 15 -65 L 15 65 L -15 65 Z" fill="none" stroke="#fff" opacity="0.5" />
                    <circle cx="0" cy="0" r="60" fill="url(#glass-grad)" stroke="#00d2ff" stroke-width="1" />
                </g>

                <g id="lens-front" transform="translate(180, 0)">
                    <path d="M -10 -75 L 40 -85 L 40 85 L -10 75 Z" fill="none" stroke="#00d2ff" stroke-width="2" filter="url(#neon-glow)"/>
                    <path d="M 40 -85 Q 70 0 40 85" fill="url(#glass-grad)" stroke="#fff" opacity="0.8"/>
                </g>
            </g>
            
            <line id="guide-line" x1="300" y1="400" x2="800" y2="400" stroke="#ff4757" stroke-width="1" stroke-dasharray="5,5" opacity="0" />

        </svg>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
